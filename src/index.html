          </ul>
        </nav>

        <!-- Правая часть: переключатель темы -->

          <button
            id="themeToggle"
            class="theme-toggle"
            aria-label="Переключить тему"
          >
            <span class="theme-icon">🌙</span>
          </button>

          <!-- Кнопка бургер-меню  -->
          <button id="menuToggle" class="menu-toggle" aria-label="Открыть меню">

            <span></span>
            <span></span>
          </button>
        </div>
      </div>
    </header>
    <!-- Мобильное меню  -->
    <div id="mobileMenu" class="mobile-menu">
      <nav>
        <ul class="mobile-nav-list">
          <li>
            <a href="#dashboard" class="mobile-nav-link active">Главная</a>
          </li>
          <li><a href="#students" class="mobile-nav-link">Ученики</a></li>
          <li><a href="#schedule" class="mobile-nav-link">Расписание</a></li>
        </ul>
      </nav>
    </div>

</div>

        

    <!-- Основной контент -->
<main class="main-content">
    <!-- Секция "Ученики" -->
    <section id="studentsSection" class="section active">
        <div class="section-header">
            <h2 class="section-title">👥 Ученики</h2>
            <button id="addStudentBtn" class="btn btn-primary">
                <span class="btn-icon">➕</span>
                Добавить ученика
            </button>
        </div>

        <!-- Поиск и фильтр -->
        <div class="search-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск по имени, фамилии или телефону...">
            <span class="student-count" id="studentCount">0 учеников</span>
        </div>

        <!-- Список учеников -->
        <div id="studentsList" class="students-list">
            <!-- Карточки учеников будут генерироваться динамически -->
            <div class="empty-state">
                <span class="empty-icon">📋</span>
                <p class="empty-text">Нет учеников</p>
                <p class="empty-subtext">Нажмите "Добавить ученика", чтобы начать</p>
            </div>
        </div>
    </section>
</main>

<!-- Модальное окно для добавления/редактирования ученика -->
<div id="studentModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Добавить ученика</h3>
            <button class="modal-close" id="closeModal">&times;</button>
        </div>
        
        <form id="studentForm" class="student-form">
            <input type="hidden" id="studentId" value="">
            
            <div class="form-group">
                <label for="firstName">Имя <span class="required">*</span></label>
                <input type="text" id="firstName" class="form-input" placeholder="Введите имя" required>
            </div>
            
            <div class="form-group">
                <label for="lastName">Фамилия <span class="required">*</span></label>
                <input type="text" id="lastName" class="form-input" placeholder="Введите фамилию" required>
            </div>
            
            <div class="form-group">
                <label for="phone">Телефон <span class="required">*</span></label>
                <input type="tel" id="phone" class="form-input" placeholder="+7 (999) 123-45-67" required>
            </div>
            
            <div class="form-group">
                <label for="email">Электронная почта</label>
                <input type="email" id="email" class="form-input" placeholder="example@mail.ru">
            </div>
            
            <div class="form-group">
                <label for="note">Заметка</label>
                <textarea id="note" class="form-textarea" rows="3" placeholder="Дополнительная информация об ученике..."></textarea>
            </div>
            
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" id="cancelBtn">Отмена</button>
                <button type="submit" class="btn btn-primary" id="saveBtn">
                    <span id="saveBtnText">Сохранить</span>
                </button>
            </div>
        </form>
    </div>
</div>
